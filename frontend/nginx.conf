server {
    listen 80;

    # 1. Serve Frontend (React Static Files)
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Redirects 404 to index.html to support React Router (SPA) behavior
        try_files $uri $uri/ /index.html;
    }

    # 2. Reverse Proxy to Backend
    # Forwards API requests to the internal 'backend' container on port 8000.
    # This creates a unified origin, avoiding CORS issues when accessing via Ngrok.
    location ~ ^/(predict|model|categories|health|docs|openapi.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Error pages configuration
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}